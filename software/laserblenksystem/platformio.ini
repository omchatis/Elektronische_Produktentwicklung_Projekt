[env:laser_g431]
platform = ststm32
board = nucleo_g431rb
framework = cmsis
board_build.f_cpu = 16000000L
upload_protocol = stlink
debug_tool = stlink
build_type = debug
debug_speed = 100
; Recovery connection requires ST-Link NRST wired to the target NRST (J1 pin 10).
upload_flags =
    -c
    reset_config srst_only srst_nogate connect_assert_srst
